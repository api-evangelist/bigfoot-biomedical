aid: bigfoot-biomedical
name: Bigfoot Biomedical
description: 'Bigfoot Biomedical was a Milpitas, California medical-device company building
  connected insulin-management technology for people with insulin-requiring diabetes. Its
  flagship product, the FDA-cleared Bigfoot Unity Diabetes Management System, paired reusable
  smart insulin pen caps with Abbott FreeStyle Libre 2 iCGM data and a clinician-set dosing
  program, displaying real-time glucose values, trends and recommended correction doses on
  the pen cap itself, alongside a patient mobile app and a Salesforce-hosted Bigfoot Clinic
  Hub portal for healthcare professionals. Abbott announced its acquisition of Bigfoot in
  September 2023 and closed it the same month; the company is now fully absorbed into Abbott
  and its website is an Abbott-hosted archive headed "Bigfoot is Now Abbott." Bigfoot never
  operated a public developer program, and no OpenAPI, AsyncAPI, GraphQL SDL, SDK, webhook
  catalog or developer portal has ever been published on its own surface.'
